openapi: 3.0.3
info:
  title: Task Management System API
  description: API для управления задачами и комментариями
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local server

paths:
  /auth/login:
    post:
      summary: Вход пользователя
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwtAuthenticationResponse"
        "400":
          description: Ошибка валидации или неверные учетные данные

  /auth/register:
    post:
      summary: Регистрация пользователя
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: Успешная регистрация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwtAuthenticationResponse"
        "400":
          description: Ошибка валидации

  /tasks:
    get:
      summary: Получить список задач
      operationId: getTasks
      parameters:
        - name: author
          in: query
          schema:
            type: string
        - name: assignee
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH]
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, IN_PROGRESS, COMPLITED]
      responses:
        "200":
          description: Список задач
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskResponse"

    post:
      summary: Создать новую задачу
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRequest"
      responses:
        "201":
          description: Задача успешно создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          description: Ошибка валидации

  /tasks/{taskId}:
    get:
      summary: Получить информацию о задаче
      operationId: getTaskById
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Детали задачи
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          description: Задача не найдена

    put:
      summary: Обновить задачу
      operationId: updateTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdateRequest"
      responses:
        "200":
          description: Задача обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "403":
          description: Недостаточно прав
        "404":
          description: Задача не найдена

    delete:
      summary: Удалить задачу
      operationId: deleteTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Задача удалена
        "403":
          description: Недостаточно прав
        "404":
          description: Задача не найдена

  /tasks/{taskId}/comments:
    post:
      summary: Добавить комментарий к задаче
      operationId: addCommentToTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "201":
          description: Комментарий добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "403":
          description: Недостаточно прав

    get:
      summary: Получить комментарии задачи
      operationId: getCommentsByTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Список комментариев
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommentResponse"
        "404":
          description: Задача не найдена

  /comments/{commentId}:
    get:
      summary: Получить комментарий
      operationId: getCommentById
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Информация о комментарии
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "404":
          description: Комментарий не найден

    put:
      summary: Обновить комментарий
      operationId: updateComment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentUpdateRequest"
      responses:
        "200":
          description: Комментарий обновлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "403":
          description: Недостаточно прав
        "404":
          description: Комментарий не найден

    delete:
      summary: Удалить комментарий
      operationId: deleteComment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Комментарий удален
        "403":
          description: Недостаточно прав
        "404":
          description: Комментарий не найден

components:
  schemas:
    CommentRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 3
          maxLength: 300
          example: "This is a comment"
      required:
        - text

    CommentUpdateRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 3
          maxLength: 300
          example: "Updated comment text"
      required:
        - text

    TaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
          example: "Fix Bug"
        description:
          type: string
          minLength: 10
          maxLength: 500
          example: "Fix the issue with the login form validation"
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLITED]
          example: "PENDING"
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          example: "HIGH"
        deadline:
          type: string
          example: "3d"
        assigneeId:
          type: integer
          format: int64
          example: 1
      required:
        - title
        - description
        - status
        - priority
        - deadline

    TaskUpdateDeadlineRequest:
      type: object
      properties:
        extension:
          type: string
          example: "3h"
      required:
        - extension

    TaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
          example: "Updated Task Title"
        description:
          type: string
          minLength: 10
          maxLength: 500
          example: "Updated task description"
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLITED]
          example: "IN_PROGRESS"
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          example: "MEDIUM"
        deadline:
          type: string
          example: "5d"
        assigneeUsername:
          type: string
          example: "assigneeUser"
        authorUsername:
          type: string
          example: "authorUser"
      required:
        - title
        - description
        - status
        - priority
        - assigneeUsername
        - authorUsername

    SignInRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@mail.com"
        password:
          type: string
          format: password
          example: "password123"
      required:
        - email
        - password

    SignUpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@mail.com"
        username:
          type: string
          example: "username"
        password:
          type: string
          format: password
          example: "password123"
        confirmPassword:
          type: string
          format: password
          example: "password123"
      required:
        - email
        - username
        - password
        - confirmPassword

    CommentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        authorName:
          type: string
          example: "user1"
        text:
          type: string
          example: "This is a comment"
        createdAt:
          type: string
          format: date-time
          example: "2025-02-08T12:00:00+03:00"
        updatedAt:
          type: string
          format: date-time
          example: "2025-02-08T12:00:00+03:00"
        taskId:
          type: integer
          format: int64
          example: 1

    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "Task Title"
        description:
          type: string
          example: "Task Description"
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLITED]
          example: "PENDING"
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          example: "HIGH"
        createdAt:
          type: string
          format: date-time
          example: "2025-02-08T12:00:00+03:00"
        updatedAt:
          type: string
          format: date-time
          example: "2025-02-08T12:00:00+03:00"
        closedAt:
          type: string
          format: date-time
          example: "2025-02-10T12:00:00+03:00"
        deadlineAt:
          type: string
          format: date-time
          example: "2025-02-15T12:00:00+03:00"
        authorUsername:
          type: string
          example: "admin"
        assigneeUsername:
          type: string
          example: "user1"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/CommentResponse"

    JwtAuthenticationResponse:
      type: object
      properties:
        token:
          type: string
          example: "jwt-token-string"

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: "user1"
        role:
          type: string
          enum: [ROLE_USER, ROLE_ADMIN]
          example: "ROLE_USER"
